[package]
name = "thrashgen"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Record a container's resource footprint and replay it as synthetic load"

[lib]
name = "thrashgen"
path = "src/lib.rs"

[[bin]]
name = "thrashgen"
path = "src/main.rs"

[features]
default = []
# Tests that need a working PMU but no privilege: counters on the test's
# own threads. See docs/testing.md.
hw-tests = []
# Tests that need CAP_PERFMON or root: per-CPU and uncore counters,
# resctrl groups. Implies hw-tests.
root-tests = ["hw-tests"]

[dependencies]
anyhow = "1.0.104"
cgroupfs = "0.9.0"
clap = { version = "4.6.7", features = ["derive"] }
libc = "0.2.190"
nix = { version = "0.31.3", features = ["mman", "sched", "resource", "fs", "process", "signal", "time"] }
perf-event2 = "0.7.4"
procfs = { version = "0.18.0", default-features = false }
rand = "0.10.3"
rand_distr = "0.6.0"
rand_xoshiro = "0.8.1"
resctrlfs = "0.9.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
proptest = "1.12.0"
tempfile = "3.27.0"

[lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "warn"

[lints.clippy]
undocumented_unsafe_blocks = "warn"
