# Lints only, by choice: formatting and clippy, with and without the
# hardware-gated features so that code compiles too. Tests, coverage and
# the experiments run on a machine with counters, as docs/testing.md
# says; a workflow that tried to would fight that machine's setup.
name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo clippy --all-targets --features hw-tests,root-tests -- -D warnings
